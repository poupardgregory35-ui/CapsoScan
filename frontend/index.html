<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaspoScan - Contrôle PMT</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6">
        <!-- En-tête -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">CaspoScan</h1>
            <p class="text-gray-600">Contrôle de conformité des prescriptions médicales de transport</p>
            <div class="bg-blue-50 border-l-4 border-blue-500 p-2 mt-4 text-sm">
                <p class="text-blue-700">
                    🔒 Conforme HDS : Données lues en mémoire puis immédiatement purgées<br>
                    ✅ Aucun stockage - Aucun affichage des documents
                </p>
            </div>
        </div>

        <!-- Zone d'upload -->
        <div
            class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <label for="fileInput" class="cursor-pointer">
                <div class="text-5xl mb-4">📄</div>
                <span
                    class="bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-600 transition-colors">
                    Importer une PMT
                </span>
                <p class="text-gray-500 text-sm mt-3">PNG, JPG, JPEG (max 5 Mo)</p>
            </label>
        </div>

        <!-- Zone de résultat (cachée au départ) -->
        <div id="result" class="mt-6 hidden"></div>

        <!-- Bouton de réinitialisation (cachée au départ) -->
        <div id="resetContainer" class="mt-4 text-center hidden">
            <button id="resetBtn"
                class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                ↺ Nouvelle analyse
            </button>
        </div>
    </div>

    <script>
        // === Éléments DOM ===
        const fileInput = document.getElementById('fileInput');
        const resultDiv = document.getElementById('result');
        const resetContainer = document.getElementById('resetContainer');
        const resetBtn = document.getElementById('resetBtn');

        // === Règles de scoring CPAM ===
        const SCORING_RULES = {
            RPPS: { penalite: -40, message: "RPPS invalide ou manquant" },
            FINESS: { penalite: -40, message: "FINESS invalide ou manquant" },
            CACHET: { penalite: -40, message: "Cachet absent" },
            NOM: { penalite: -10, message: "Nom manquant" },
            PRENOM: { penalite: -10, message: "Prénom manquant" }
        };

        const COLOR_THRESHOLDS = {
            VERT: { max: 0, class: "bg-green-100 border-green-500 text-green-800" },
            BLEU: { max: 40, class: "bg-blue-100 border-blue-500 text-blue-800" },
            ORANGE: { max: 70, class: "bg-orange-100 border-orange-500 text-orange-800" },
            ROUGE: { max: Infinity, class: "bg-red-100 border-red-500 text-red-800" }
        };

        // === Fonction de simulation OCR ===
        async function simulateOCR() {
            console.log("🔍 Analyse OCR simulée...");

            // Simuler un délai d'analyse
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Pour la démo, on simule une détection basée sur le document (Établissement si SAMU/CHU/HOPITAL)
            // On peut forcer un cas parfait pour la démo
            const isEtablissement = true; // Forcé en Établissement pour le cas SAMU 35

            if (isEtablissement) {
                return {
                    type: "etablissement",
                    finess: "350000741",
                    rpps: "",
                    cachet: "present",
                    nom: "HOUEE",
                    prenom: "Yuna",
                    raw: `FINESS: 350000741\nCachet: présent\nSAMU 35 - CHU RENNES`
                };
            } else {
                return {
                    type: "liberal",
                    rpps: "12345678901",
                    finess: "",
                    cachet: "present",
                    nom: "DUPONT",
                    prenom: "Jean",
                    raw: `RPPS: 12345678901\nCachet: présent\nDr DUPONT Jean`
                };
            }
        }

        // === Fonction de calcul du score ===
        function calculateScore(ocrData) {
            let totalScore = 0;
            const details = [];

            // Valider selon le type de structure
            if (ocrData.type === "etablissement") {
                // Établissement : FINESS obligatoire
                if (!ocrData.finess) {
                    totalScore += SCORING_RULES.FINESS.penalite;
                    details.push({ champ: "FINESS", status: "❌", message: SCORING_RULES.FINESS.message });
                } else {
                    details.push({ champ: "FINESS", status: "✅", message: "FINESS valide" });
                }
                details.push({ champ: "RPPS", status: "⏸️", message: "Non requis (établissement)" });
            } else {
                // Libéral : RPPS obligatoire
                if (!ocrData.rpps) {
                    totalScore += SCORING_RULES.RPPS.penalite;
                    details.push({ champ: "RPPS", status: "❌", message: SCORING_RULES.RPPS.message });
                } else {
                    details.push({ champ: "RPPS", status: "✅", message: "RPPS valide" });
                }
                details.push({ champ: "FINESS", status: "⏸️", message: "Optionnel (libéral)" });
            }

            // Cachet toujours obligatoire
            if (ocrData.cachet !== "present") {
                totalScore += SCORING_RULES.CACHET.penalite;
                details.push({ champ: "Cachet", status: "❌", message: SCORING_RULES.CACHET.message });
            } else {
                details.push({ champ: "Cachet", status: "✅", message: "Cachet présent" });
            }

            // Nom/Prénom toujours obligatoires
            if (!ocrData.nom) {
                totalScore += SCORING_RULES.NOM.penalite;
                details.push({ champ: "Nom", status: "❌", message: SCORING_RULES.NOM.message });
            } else {
                details.push({ champ: "Nom", status: "✅", message: `Nom: ${ocrData.nom}` });
            }

            if (!ocrData.prenom) {
                totalScore += SCORING_RULES.PRENOM.penalite;
                details.push({ champ: "Prénom", status: "❌", message: SCORING_RULES.PRENOM.message });
            } else {
                details.push({ champ: "Prénom", status: "✅", message: `Prénom: ${ocrData.prenom}` });
            }

            return { totalScore, details };
        }

        // === Fonction pour obtenir la couleur selon le score ===
        function getScoreColor(score) {
            if (score <= COLOR_THRESHOLDS.VERT.max) return "VERT";
            if (score <= COLOR_THRESHOLDS.BLEU.max) return "BLEU";
            if (score <= COLOR_THRESHOLDS.ORANGE.max) return "ORANGE";
            return "ROUGE";
        }

        // === Fonction d'affichage des résultats ===
        function displayResults(ocrData, scoreResult) {
            const color = getScoreColor(scoreResult.totalScore);
            const colorClass = COLOR_THRESHOLDS[color].class;

            // Construire le HTML des résultats
            let detailsHtml = scoreResult.details.map(d =>
                `<div class="flex items-center text-sm">
                    <span class="w-16">${d.status}</span>
                    <span class="w-24 font-medium">${d.champ}:</span>
                    <span class="text-gray-600">${d.message}</span>
                </div>`
            ).join('');

            resultDiv.innerHTML = `
                <div class="border-l-4 ${colorClass} p-4 rounded">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold text-lg">Résultat de l'analyse</span>
                        <span class="px-3 py-1 rounded-full bg-white text-sm font-semibold">
                            ${ocrData.type === "etablissement" ? "🏥 Établissement" : "👨⚕️ Libéral"}
                        </span>
                    </div>
                    
                    <div class="space-y-1 mb-4">
                        ${detailsHtml}
                    </div>
                    
                    <div class="text-center mt-4 pt-3 border-t border-gray-200">
                        <span class="text-2xl font-bold">Score: ${scoreResult.totalScore}</span>
                        <span class="ml-2 px-3 py-1 rounded-full bg-white text-sm font-semibold">
                            ${color}
                        </span>
                    </div>
                </div>
            `;

            resultDiv.classList.remove('hidden');
            resetContainer.classList.remove('hidden');
        }

        // === Fonction principale de traitement ===
        async function handleFile(file) {
            if (!file) return;

            // Afficher le chargement
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-block animate-spin text-4xl mb-4">⚙️</div>
                    <p class="text-gray-600">Analyse en cours...</p>
                    <p class="text-sm text-gray-400">Lecture HDS - Données non stockées</p>
                </div>
            `;
            resetContainer.classList.add('hidden');

            try {
                // Simuler l'OCR (pas de Tesseract !)
                const ocrData = await simulateOCR();

                // Calculer le score selon les règles CPAM
                const scoreResult = calculateScore(ocrData);

                // Afficher les résultats
                displayResults(ocrData, scoreResult);

                // Purge mémoire simulée
                console.log("🧹 Purge mémoire HDS effectuée");

            } catch (error) {
                console.error("Erreur technique:", error);
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded">
                        <p class="font-bold text-red-800">❌ Erreur technique</p>
                        <p class="text-red-600">Veuillez réessayer</p>
                    </div>
                `;
                resetContainer.classList.remove('hidden');
            }
        }

        // === Event Listeners ===
        if (fileInput) {
            fileInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                handleFile(file);
                // Reset l'input pour permettre de re-sélectionner le même fichier
                this.value = '';
            });
        } else {
            console.error("fileInput non trouvé");
        }

        if (resetBtn) {
            resetBtn.addEventListener('click', function () {
                resultDiv.classList.add('hidden');
                resetContainer.classList.add('hidden');
                resultDiv.innerHTML = '';
            });
        }

        console.log("✅ CaspoScan prêt - Mode HDS actif");
    </script>
</body>

</html>
