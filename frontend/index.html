<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapsoScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <!-- Header ultra simple -->
    <div class="bg-white shadow-sm border-b border-gray-200 py-4">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold text-blue-900">CapsoScan</h1>
        </div>
    </div>

    <!-- Contenu principal -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl mb-4">Analyse de PMT</h2>
            <p class="text-gray-600 mb-4">Importez votre prescription médicale de transport</p>

            <!-- Zone d'upload -->
            <div
                class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
                <input type="file" id="fileInput" accept="image/*" class="hidden">
                <label for="fileInput" class="cursor-pointer">
                    <div class="text-5xl mb-4">📄</div>
                    <span class="bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold">
                        Importer une PMT
                    </span>
                </label>
            </div>

            <!-- Résultat -->
            <div id="result" class="mt-6 hidden"></div>

            <!-- Bouton de réinitialisation (caché au départ) -->
            <div id="resetContainer" class="mt-4 text-center hidden">
                <button id="resetBtn"
                    class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                    ↺ Nouvelle analyse
                </button>
            </div>
        </div>
    </main>

    <script>
        // === Éléments DOM ===
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput'); // Will be null in this simplified version
        const resultDiv = document.getElementById('result');
        const resetContainer = document.getElementById('resetContainer');
        const resetBtn = document.getElementById('resetBtn');
        const mainCard = document.querySelector('.bg-white');

        // === Règles de scoring CPAM ===
        const SCORING_RULES = {
            RPPS: { penalite: -40, message: "RPPS invalide ou manquant" },
            FINESS: { penalite: -40, message: "FINESS invalide ou manquant" },
            CACHET: { penalite: -40, message: "Cachet absent" },
            NOM: { penalite: -10, message: "Nom manquant" },
            PRENOM: { penalite: -10, message: "Prénom manquant" }
        };

        const COLOR_THRESHOLDS = {
            VERT: { min: 100, class: "bg-green-100 border-green-500 text-green-800" },
            BLEU: { min: 75, class: "bg-blue-100 border-blue-500 text-blue-800" },
            ORANGE: { min: 50, class: "bg-orange-100 border-orange-500 text-orange-800" },
            ROUGE: { min: 25, class: "bg-red-100 border-red-500 text-red-800" },
            NOIR: { min: 0, class: "bg-gray-900 border-black text-white" }
        };

        // === Fonction de simulation OCR ===
        async function simulateOCR() {
            console.log("🔍 Analyse OCR simulée...");

            // Simuler un délai d'analyse
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Pour la démo, on simule une détection basée sur le document (Établissement si SAMU/CHU/HOPITAL)
            const isEtablissement = true;

            if (isEtablissement) {
                return {
                    type: "etablissement",
                    finess: "350000741",
                    rpps: "",
                    cachet: "present",
                    nom: "HOUEE",
                    prenom: "Yuna",
                    raw: `FINESS: 350000741\nCachet: présent\nSAMU 35 - CHU RENNES\nSituation: [X] Entrée/sortie d'hospitalisation\nTransport: [X] Ambulance (position allongée)`
                };
            } else {
                return {
                    type: "liberal",
                    rpps: "12345678901",
                    finess: "",
                    cachet: "present",
                    nom: "DUPONT",
                    prenom: "Jean",
                    raw: `RPPS: 12345678901\nCachet: présent\nDr DUPONT Jean\nSituation: [X] ALD exonérante\nTransport: [X] VSL`
                };
            }
        }

        // === Fonction de calcul du score ===
        function calculateScore(ocrData) {
            let totalScore = 0;
            const details = [];

            // Valider selon le type de structure
            if (ocrData.type === "etablissement") {
                if (!ocrData.finess) {
                    totalScore += SCORING_RULES.FINESS.penalite;
                    details.push({ champ: "FINESS", status: "❌", message: SCORING_RULES.FINESS.message });
                } else {
                    details.push({ champ: "FINESS", status: "✅", message: "FINESS valide" });
                }
                details.push({ champ: "RPPS", status: "⏸️", message: "Non requis (éts)" });
            } else {
                if (!ocrData.rpps) {
                    totalScore += SCORING_RULES.RPPS.penalite;
                    details.push({ champ: "RPPS", status: "❌", message: SCORING_RULES.RPPS.message });
                } else {
                    details.push({ champ: "RPPS", status: "✅", message: "RPPS valide" });
                }
                details.push({ champ: "FINESS", status: "⏸️", message: "Optionnel (lib)" });
            }

            if (ocrData.cachet !== "present") {
                totalScore += SCORING_RULES.CACHET.penalite;
                details.push({ champ: "Cachet", status: "❌", message: SCORING_RULES.CACHET.message });
            } else {
                details.push({ champ: "Cachet", status: "✅", message: "Cachet présent" });
            }

            if (!ocrData.nom) totalScore += SCORING_RULES.NOM.penalite;
            if (!ocrData.prenom) totalScore += SCORING_RULES.PRENOM.penalite;

            return { totalScore, details };
        }

        // === Fonction d'affichage des résultats ===
        function displayResults(ocrData, scoreResult) {
            const raw = ocrData.raw || "";

            // 1. Détection des situations (basée sur raw text simplifié)
            const situation = {
                hospitalisation: raw.includes("hospitalisation"),
                aldExonerante: raw.includes("ALD exonérante"),
                aldNonExonerante: raw.includes("ALD non exonérante"),
                atMp: raw.includes("travail") || raw.includes("AT/MP")
            };

            // 2. Détection du mode de transport
            const transport = {
                ambulance: raw.includes("Ambulance") || raw.includes("allongée"),
                vslTaxi: raw.includes("VSL") || raw.includes("taxi"),
                individuel: raw.includes("individuel")
            };

            // 3. Logique de Prise en Charge
            let priseEnCharge = "Ticket modérateur standard (65%)";
            let pecDetails = "Reste à charge patient ou mutuelle.";

            if (ocrData.type === "etablissement" && raw.includes("SAMU")) {
                priseEnCharge = "✅ 100% CPAM (Urgence SAMU)";
                pecDetails = "Prise en charge intégrale sans formalité ALD.";
            } else if (situation.aldExonerante) {
                priseEnCharge = "✅ 100% CPAM (ALD exonérante)";
                pecDetails = "Facturation directe en tiers-payant.";
            } else if (situation.atMp) {
                priseEnCharge = "✅ 100% CPAM (AT/MP)";
                pecDetails = "Couverture accident du travail.";
            }

            // 4. Scoring & Couleurs
            const maxPenalty = -120;
            const percentage = Math.max(0, Math.min(100, 100 - (Math.abs(scoreResult.totalScore) / Math.abs(maxPenalty) * 100)));
            let color = "NOIR";
            if (percentage >= 100) color = "VERT";
            else if (percentage >= 75) color = "BLEU";
            else if (percentage >= 50) color = "ORANGE";
            else if (percentage >= 25) color = "ROUGE";
            else if (percentage >= 0) color = "ROUGE";

            const colorClass = COLOR_THRESHOLDS[color].class;

            resultDiv.innerHTML = `
                <div class="border-l-4 ${colorClass} p-5 rounded-lg shadow-inner space-y-4">
                    <!-- Header -->
                    <div class="flex justify-between items-center pb-2 border-b border-white border-opacity-20">
                        <span class="font-bold text-xl">Analyse Experts</span>
                        <span class="px-3 py-1 rounded-full bg-white bg-opacity-20 text-xs font-bold uppercase tracking-wider">
                            ${ocrData.type === "etablissement" ? "🏥 Établissement" : "👨‍⚕️ Libéral"}
                        </span>
                    </div>
                    
                    <!-- 1. Champs de structure -->
                    <div class="space-y-1">
                        <p class="text-[10px] uppercase font-bold tracking-widest opacity-60 mb-1">Identifiants Structure</p>
                        ${scoreResult.details.map(d => `
                            <div class="flex items-center text-sm">
                                <span class="w-8">${d.status}</span>
                                <span class="w-20 font-medium">${d.champ}:</span>
                                <span class="text-opacity-90 font-semibold">${d.message}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- 2. Situation Patient -->
                    <div class="bg-black bg-opacity-5 p-3 rounded-lg">
                        <p class="text-[10px] uppercase font-bold tracking-widest opacity-60 mb-2">📋 Situation du Patient</p>
                        <div class="grid grid-cols-1 gap-1 text-xs">
                            <div class="flex items-center ${situation.hospitalisation ? 'font-bold' : 'opacity-40'}">
                                <span class="w-6">${situation.hospitalisation ? "✅" : "❌"}</span>
                                <span>Hospitalisation (Entrée/Sortie/Séance)</span>
                            </div>
                            <div class="flex items-center ${situation.aldExonerante ? 'font-bold' : 'opacity-40'}">
                                <span class="w-6">${situation.aldExonerante ? "✅" : "❌"}</span>
                                <span>ALD exonérante</span>
                            </div>
                            <div class="flex items-center ${situation.atMp ? 'font-bold' : 'opacity-40'}">
                                <span class="w-6">${situation.atMp ? "✅" : "❌"}</span>
                                <span>Accident Travail / MP</span>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Mode de Transport -->
                    <div class="bg-black bg-opacity-5 p-3 rounded-lg">
                        <p class="text-[10px] uppercase font-bold tracking-widest opacity-60 mb-2">🚑 Mode de Transport</p>
                        <div class="grid grid-cols-1 gap-1 text-xs">
                            <div class="flex items-center ${transport.ambulance ? 'font-bold' : 'opacity-40'}">
                                <span class="w-6">${transport.ambulance ? "✅" : "❌"}</span>
                                <span>Ambulance (Allongé/Surveillance)</span>
                            </div>
                            <div class="flex items-center ${transport.vslTaxi ? 'font-bold' : 'opacity-40'}">
                                <span class="w-6">${transport.vslTaxi ? "✅" : "❌"}</span>
                                <span>VSL ou TAXI Conventionné</span>
                            </div>
                        </div>
                    </div>

                    <!-- 4. Prise en Charge -->
                    <div class="bg-white bg-opacity-30 p-3 rounded-lg border border-white border-opacity-20 text-sm">
                         <p class="font-bold flex items-center gap-2">
                             <span>💰 Prise en charge :</span>
                             <span class="px-2 py-0.5 rounded bg-white bg-opacity-50 text-[10px]">${priseEnCharge}</span>
                         </p>
                         <p class="text-xs mt-1 opacity-80">${pecDetails}</p>
                    </div>

                    <!-- 5. Score Final -->
                    <div class="text-center pt-4 border-t border-white border-opacity-20">
                        <div class="text-3xl font-black mb-1">${Math.round(percentage)}% conforme</div>
                        <div class="text-[10px] italic opacity-70 mb-2">
                             🔒 Données purgées après lecture (HDS)
                        </div>
                        <div class="text-xs font-bold uppercase tracking-widest opacity-80">
                            Niveau CPAM : ${color}
                        </div>
                    </div>
                </div>
            `;

            resultDiv.classList.remove('hidden');
            if (resetContainer) resetContainer.classList.remove('hidden');
        }

        // === Fonction principale de traitement ===
        async function handleFile(file) {
            if (!file) return;

            // Afficher le chargement
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-block animate-spin text-4xl mb-4">⚙️</div>
                    <p class="text-gray-600">Analyse en cours...</p>
                    <p class="text-sm text-gray-400">Lecture HDS - Données non stockées</p>
                </div>
            `;
            if (resetContainer) resetContainer.classList.add('hidden');

            try {
                // Simuler l'OCR (pas de Tesseract !)
                const ocrData = await simulateOCR();

                // Calculer le score selon les règles CPAM
                const scoreResult = calculateScore(ocrData);

                // Afficher les résultats
                displayResults(ocrData, scoreResult);

                // Purge mémoire simulée
                console.log("🧹 Purge mémoire HDS effectuée");

            } catch (error) {
                console.error("Erreur technique:", error);
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded">
                        <p class="font-bold text-red-800">❌ Erreur technique</p>
                        <p class="text-red-600">Veuillez réessayer</p>
                    </div>
                `;
                if (resetContainer) resetContainer.classList.remove('hidden');
            }
        }

        // === Event Listeners ===
        function setupCapture(input, isCamera = false) {
            if (!input) return;
            input.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    if (isCamera) {
                        console.log("📸 Capture terrain détectée");
                    }
                    handleFile(file);
                }
                this.value = ''; // Reset
            });
        }

        setupCapture(fileInput);
        setupCapture(cameraInput, true);

        if (resetBtn) {
            resetBtn.addEventListener('click', function () {
                resultDiv.classList.add('hidden');
                if (resetContainer) resetContainer.classList.add('hidden');
                resultDiv.innerHTML = '';
            });
        }

        console.log("✅ CapsoScan prêt - Mode HDS actif");
    </script>
</body>

</html>
